{% if messages %}
  {% for row in messages %}
    <div class="list-group-item message-item" data-id="{{ row.id }}">
      <div class="d-flex align-items-start justify-content-between gap-2">
        <div>
          <h3 class="h6 mb-1">{{ row.username }}</h3>
          <p class="mb-2">{{ row.message|linebreaksbr }}</p>
          <small class="text-muted">{{ row.email }} · {{ row.created_at }}</small>
        </div>
        <button type="button" class="btn btn-outline-danger btn-sm delete-message-btn">Видалити</button>
      </div>
    </div>
  {% endfor %}
{% else %}
  <div class="list-group-item text-muted">Поки що повідомлень немає.</div>
{% endif %}
